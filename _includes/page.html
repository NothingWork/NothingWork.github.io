<div class="paginator">
  <!-- 页面跳转 -->
  <a href="{{ paginator.previous_page_path }}" class="basicA"
    ><button>上一页</button>
  </a>
  /
  <a href="{{ paginator.next_page_path }}" class="basicA">
    <button>下一页</button>
    </a>
  &emsp;&emsp; 当前第 {{ paginator.page }} 页 &emsp;&emsp; 共 {{
  paginator.total_pages }} 页
</div>
