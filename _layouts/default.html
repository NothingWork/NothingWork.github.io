<!DOCTYPE html>
<!-- html元数据引入 -->
  {%- include head.html -%}
  <body >
        <!-- 加载动画层 -->
        {%- include loading.html -%}
    <!-- 头部区域 -->
      {%- include header.html -%}

      <!-- 侧边栏 -->
      <img class="aside-man" src="" id="aside_man">
  </img>
    <!-- 主体内容区域 -->
    <main>
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    <!-- 弹窗遮罩层 -->
<div class="mask" id="mask"></div>
  <!-- 弹窗组件 -->
  <div id="parts" style="display: none;">
    {%- include 2048.html -%}
  </div>
  </body>
</html>

<!-- 引入鼠标点击特效 -->
<script src="/assets/plugins/click.js"></script>
<script>
  // 页面加载时调用函数
window.addEventListener('load', getRandomBg);
  // 按钮跳转网页的功能
  function goSite(site) {
    window.location.href = site;
  }

// 背景元素
var aside_man = document.getElementById("aside_man")

// 判断是不是第一次点击
var isInit = true

  // 监听点击事件
  $("#mask").click(function(){
      // 隐藏遮罩层
      $("#mask").hide();
      $("#parts").hide();
    })
    $("#2048Btn").click(function(){
      // 展示遮罩层
      $("#mask").show();
      // 展示组件
      $("#parts").show();
      // 初始化
      if(isInit){
        gameInit();
        isInit = !isInit; 
      }
    })

// 背景分组
const bgs = [
  {
    "bg":"#dd465b",
    "img":"/assets/bg/fll.webp"
  },
  {
    "bg":"#db6053",
    "img":"/assets/bg/fl.webp"
  },
  {
    "bg":"#db2e2d",
    "img":"/assets/bg/art1.webp"
  },
  {
    "bg":"#000000",
    "img":"/assets/bg/cat1.webp"
  },
  {
    "bg":"#0b0e16",
    "img":"/assets/bg/code1.webp"
  },
  {
    "bg":"#000000",
    "img":"/assets/bg/spider1.webp"
  },
  {
    "bg":"#000000",
    "img":"/assets/bg/art2.webp"
  },
  {
    "bg":"#c1c1c1",
    "img":"/assets/bg/art3.webp"
  },
  {
    "bg":"#3b3b3b",
    "img":"/assets/bg/kkx.webp"
  },
  {
    "bg":"#ada8ae",
    "img":"/assets/bg/art4.webp"
  }
]

// 网站随机背景
function getRandomBg() {
  const num = Math.floor(Math.random() * 10)
  document.body.style.backgroundColor = bgs[num].bg;
  aside_man.setAttribute("src",bgs[num].img)
}



</script>
