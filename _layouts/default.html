<script>
  // 按钮跳转网页的功能
  function goSite(site) {
    window.location.href = site;
  }
  // 获取每日一言
  $(function(){

      if(res.code===200)$("#content").text(res.data.content+"——"+res.data.origin)
    })
  })
</script>
